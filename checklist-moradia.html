<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Minha Casa — Checklist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --stage: #1B1613;
    --stage-2: #241D18;
    --card: #F6F0E4;
    --card-line: #E3D9C4;
    --ink: #372E27;
    --ink-soft: #948A78;
    --ink-faint: #B9AF9C;
    --accent: #8B4A32;
    --accent-soft: rgba(139, 74, 50, 0.14);
    --sage: #6E7D5E;
    --radius-card: 30px;
    --serif: "Playfair Display", "Iowan Old Style", "Georgia", serif;
    --sans: "Work Sans", -apple-system, "Segoe UI", sans-serif;
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body{
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--stage);
  }

  body{
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px 16px;
    background:
      radial-gradient(120% 90% at 50% -10%, var(--stage-2) 0%, var(--stage) 60%);
    font-family: var(--sans);
    color: var(--ink);
  }

  .stage-label{
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-family: var(--sans);
    font-size: 12.5px;
    letter-spacing: 0.02em;
    color: var(--ink-faint);
    opacity: 0.75;
  }

  .card{
    position: relative;
    width: 100%;
    max-width: 380px;
    background: var(--card);
    border-radius: var(--radius-card);
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.55), 0 2px 0 rgba(255,255,255,0.4) inset;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 560px;
  }

  .card-top{
    padding: 22px 24px 0 24px;
  }

  .progress-rail{
    height: 3px;
    width: 100%;
    background: var(--card-line);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill{
    height: 100%;
    width: 0%;
    background: var(--accent);
    border-radius: 3px;
    transition: width 0.45s ease;
  }

  .top-row{
    display: flex;
    align-items: center;
    justify-content: flex-end;
    margin-top: 14px;
  }

  .counter-pill{
    font-family: var(--sans);
    font-size: 12px;
    color: var(--ink-soft);
    background: var(--card);
    border: 1px solid var(--card-line);
    padding: 4px 11px;
    border-radius: 999px;
  }

  .track-viewport{
    flex: 1;
    overflow: hidden;
  }

  .track{
    display: flex;
    height: 100%;
    transition: transform 0.4s cubic-bezier(.65,0,.35,1);
  }

  .panel{
    flex: 0 0 100%;
    width: 100%;
    padding: 6px 26px 8px 26px;
    display: flex;
    flex-direction: column;
  }

  .panel-head{
    text-align: center;
    padding: 8px 0 18px 0;
  }

  .panel-emoji{
    font-size: 30px;
    line-height: 1;
    display: block;
    margin-bottom: 8px;
  }

  .panel-title{
    font-family: var(--serif);
    font-weight: 600;
    font-size: 23px;
    color: var(--ink);
    margin: 0;
  }

  .panel-sub{
    font-family: var(--sans);
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-top: 5px;
  }

  .item-list{
    list-style: none;
    margin: 0;
    padding: 2px 0 0 0;
    display: flex;
    flex-direction: column;
  }

  .item-row{
    display: flex;
    align-items: flex-start;
    gap: 13px;
    padding: 11px 2px;
    border-bottom: 1px solid var(--card-line);
  }
  .item-row:last-child{ border-bottom: none; }

  .check-btn{
    flex: 0 0 auto;
    width: 24px;
    height: 24px;
    margin-top: 1px;
    border-radius: 50%;
    border: 1.6px solid var(--ink-faint);
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
    transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
  }
  .check-btn:active{ transform: scale(0.9); }
  .check-btn:focus-visible{
    outline: none;
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .check-btn.checked{
    background: var(--accent);
    border-color: var(--accent);
  }
  .check-btn svg{
    width: 13px;
    height: 13px;
    opacity: 0;
    transform: scale(0.4);
    transition: opacity 0.15s ease, transform 0.2s cubic-bezier(.34,1.56,.64,1);
  }
  .check-btn.checked svg{
    opacity: 1;
    transform: scale(1);
  }

  .item-label{
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.42;
    color: var(--ink);
    padding-top: 2px;
    transition: color 0.2s ease;
  }
  .item-row.done .item-label{
    color: var(--ink-faint);
    text-decoration: line-through;
    text-decoration-color: var(--ink-faint);
    text-decoration-thickness: 1px;
  }

  .card-bottom{
    padding: 14px 20px 22px 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
  }

  .nav-arrow{
    background: none;
    border: none;
    color: var(--ink-soft);
    font-family: var(--serif);
    font-size: 20px;
    cursor: pointer;
    padding: 6px 4px;
    line-height: 1;
    transition: color 0.2s ease, opacity 0.2s ease;
  }
  .nav-arrow:hover{ color: var(--ink); }
  .nav-arrow[disabled]{ opacity: 0.25; cursor: default; }
  .nav-arrow:focus-visible{
    outline: none;
    box-shadow: 0 0 0 3px var(--accent-soft);
    border-radius: 6px;
  }

  .dots{
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .dot{
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--card-line);
    border: none;
    padding: 0;
    cursor: pointer;
    transition: background 0.25s ease, width 0.25s ease;
  }
  .dot.active{
    background: var(--accent);
    width: 16px;
    border-radius: 4px;
  }

  @media (max-height: 700px){
    .card{ min-height: 500px; }
    .panel-head{ padding-bottom: 10px; }
  }
</style>
</head>
<body>

<div class="stage-label">enxoval da casa nova</div>

<div class="card" id="card">
  <div class="card-top">
    <div class="progress-rail"><div class="progress-fill" id="progressFill"></div></div>
    <div class="top-row">
      <div class="counter-pill" id="counterPill">1 / 5</div>
    </div>
  </div>

  <div class="track-viewport" id="trackViewport">
    <div class="track" id="track"></div>
  </div>

  <div class="card-bottom">
    <button class="nav-arrow" id="prevBtn" aria-label="Categoria anterior">‹</button>
    <div class="dots" id="dots"></div>
    <button class="nav-arrow" id="nextBtn" aria-label="Próxima categoria">›</button>
  </div>
</div>

<script>
(function(){
  var DATA = [
    { id: "cozinha", emoji: "🍳", title: "Cozinha e Preparo", items: [
      "Fogão",
      "Geladeira",
      "Air fryer ou sanduicheira/grill",
      "Escorredor de louça",
      "Escorredor de macarrão/arroz",
      "Forma de gelo",
      "Potes de vidro com tampa"
    ]},
    { id: "lavanderia", emoji: "🧺", title: "Lavanderia", items: [
      "Tanquinho",
      "Cesto de roupa suja",
      "Balde",
      "Bacia"
    ]},
    { id: "banheiro", emoji: "🚿", title: "Banheiro", items: [
      "Jogo de toalhas",
      "Toalhas de rosto",
      "Toalha de piso",
      "Porta-sabonete",
      "Tapete de banheiro",
      "Kit lavabo",
      "Lixeira / escova sanitária",
      "Rodo"
    ]},
    { id: "manutencao", emoji: "🔧", title: "Manutenção", items: [
      "Kit básico de ferramentas (chave fenda/philips)",
      "Pregos e buchas",
      "Ganchos adesivos",
      "Filtro de linha com fusível"
    ]},
    { id: "conforto", emoji: "🛋️", title: "Conforto", items: [
      "Mesa pequena com cadeiras",
      "Capacho",
      "Vassoura e pano de chão",
      "Sacos de lixo"
    ]}
  ];

  var STORAGE_KEY = "checklist-moradia-v1";
  var state = {};
  var current = 0;

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      state = raw ? JSON.parse(raw) : {};
    }catch(e){
      state = {};
    }
  }

  function saveState(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }catch(e){ /* segue sem salvar */ }
  }

  var track = document.getElementById("track");
  var dotsWrap = document.getElementById("dots");
  var counterPill = document.getElementById("counterPill");
  var progressFill = document.getElementById("progressFill");
  var prevBtn = document.getElementById("prevBtn");
  var nextBtn = document.getElementById("nextBtn");

  var checkIconSVG = '<svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">' +
    '<path d="M3 8.5L6.2 11.7L13 4" stroke="#F6F0E4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function keyFor(catIndex, itemIndex){
    return DATA[catIndex].id + "-" + itemIndex;
  }

  function buildPanels(){
    DATA.forEach(function(cat, ci){
      var panel = document.createElement("div");
      panel.className = "panel";

      var head = document.createElement("div");
      head.className = "panel-head";
      head.innerHTML =
        '<span class="panel-emoji">' + cat.emoji + '</span>' +
        '<h2 class="panel-title">' + cat.title + '</h2>' +
        '<div class="panel-sub" data-sub="' + ci + '"></div>';
      panel.appendChild(head);

      var list = document.createElement("ul");
      list.className = "item-list";

      cat.items.forEach(function(label, ii){
        var li = document.createElement("li");
        li.className = "item-row";
        li.dataset.key = keyFor(ci, ii);

        var btn = document.createElement("button");
        btn.className = "check-btn";
        btn.setAttribute("aria-pressed", "false");
        btn.setAttribute("aria-label", "Marcar " + label + " como comprado");
        btn.innerHTML = checkIconSVG;

        var span = document.createElement("span");
        span.className = "item-label";
        span.textContent = label;

        btn.addEventListener("click", function(){
          toggleItem(li, btn, keyFor(ci, ii));
        });

        li.appendChild(btn);
        li.appendChild(span);
        list.appendChild(li);
      });

      panel.appendChild(list);
      track.appendChild(panel);
    });
  }

  function toggleItem(li, btn, key){
    var isDone = !state[key];
    state[key] = isDone;
    li.classList.toggle("done", isDone);
    btn.classList.toggle("checked", isDone);
    btn.setAttribute("aria-pressed", isDone ? "true" : "false");
    saveState();
    updateProgress();
  }

  function applyState(){
    var rows = track.querySelectorAll(".item-row");
    rows.forEach(function(li){
      var key = li.dataset.key;
      var done = !!state[key];
      var btn = li.querySelector(".check-btn");
      li.classList.toggle("done", done);
      btn.classList.toggle("checked", done);
      btn.setAttribute("aria-pressed", done ? "true" : "false");
    });
  }

  function updateSubtitles(){
    DATA.forEach(function(cat, ci){
      var done = 0;
      cat.items.forEach(function(_, ii){
        if(state[keyFor(ci, ii)]) done++;
      });
      var el = document.querySelector('[data-sub="' + ci + '"]');
      if(el) el.textContent = done + " de " + cat.items.length + " já comprados";
    });
  }

  function updateProgress(){
    var total = 0, done = 0;
    DATA.forEach(function(cat, ci){
      cat.items.forEach(function(_, ii){
        total++;
        if(state[keyFor(ci, ii)]) done++;
      });
    });
    var pct = total ? Math.round((done/total)*100) : 0;
    progressFill.style.width = pct + "%";
    updateSubtitles();
  }

  function buildDots(){
    DATA.forEach(function(_, i){
      var d = document.createElement("button");
      d.className = "dot";
      d.setAttribute("aria-label", "Ir para categoria " + (i+1));
      d.addEventListener("click", function(){ goTo(i); });
      dotsWrap.appendChild(d);
    });
  }

  function goTo(index){
    if(index < 0 || index >= DATA.length) return;
    current = index;
    track.style.transform = "translateX(-" + (current * 100) + "%)";
    counterPill.textContent = (current + 1) + " / " + DATA.length;

    var dots = dotsWrap.querySelectorAll(".dot");
    dots.forEach(function(d, i){ d.classList.toggle("active", i === current); });

    prevBtn.disabled = current === 0;
    nextBtn.disabled = current === DATA.length - 1;
  }

  prevBtn.addEventListener("click", function(){ goTo(current - 1); });
  nextBtn.addEventListener("click", function(){ goTo(current + 1); });

  document.addEventListener("keydown", function(e){
    if(e.key === "ArrowRight") goTo(current + 1);
    if(e.key === "ArrowLeft") goTo(current - 1);
  });

  var touchStartX = null;
  var viewport = document.getElementById("trackViewport");
  viewport.addEventListener("touchstart", function(e){
    touchStartX = e.touches[0].clientX;
  }, { passive: true });
  viewport.addEventListener("touchend", function(e){
    if(touchStartX === null) return;
    var dx = e.changedTouches[0].clientX - touchStartX;
    if(Math.abs(dx) > 45){
      if(dx < 0) goTo(current + 1);
      else goTo(current - 1);
    }
    touchStartX = null;
  });

  loadState();
  buildPanels();
  buildDots();
  applyState();
  updateProgress();
  goTo(0);
})();
</script>
</body>
</html>
